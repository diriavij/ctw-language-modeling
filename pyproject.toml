[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctw-language-modeling"
version = "0.1.0"
description = "Context-tree language modeling and finite-memory experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Foma Popov"}]
keywords = ["context-tree weighting", "language modeling", "information theory"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=8"]
experiments = [
  "datasets>=2.20",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "torch>=2.2",
  "transformers>=4.40",
]

[tool.setuptools]
packages = ["ctw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
